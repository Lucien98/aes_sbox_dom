name: Check optimized DOM-dep RTL

on:
  push:
    branches: ["optimize-dom-dep-multiplier"]

permissions:
  contents: read

jobs:
  equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install iverilog
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
      - name: Prepare reference RTL and testbench
        run: |
          git show origin/main:real_dom_shared_mul_gf2.v | sed 's/^module real_dom_shared_mul_gf2 /module real_dom_shared_mul_gf2_old /' > /tmp/old_mul.v
          git show origin/main:real_dom_shared_sqscmul_gf2.v | sed 's/^module real_dom_shared_sqscmul_gf2 /module real_dom_shared_sqscmul_gf2_old /' > /tmp/old_sqsc.v
          git show origin/main:real_dom_shared_mul_gf2_paired.v | sed 's/^module real_dom_shared_mul_gf2_paired /module real_dom_shared_mul_gf2_paired_old /' > /tmp/old_paired.v
          cat > /tmp/tb_equiv.v <<'EOF'
          `timescale 1ns/1ps
          module tb #(
              parameter SHARES = 3
          );
              function integer blind_nrnd(input integer s);
              begin
                  if (s == 1) blind_nrnd = 1;
                  else if (s == 2) blind_nrnd = 1;
                  else blind_nrnd = s;
              end
              endfunction

              localparam BN = blind_nrnd(SHARES);
              localparam ZW = SHARES*(SHARES-1);
              reg clk;
              reg [2*SHARES-1:0] x, x1, x2, y;
              reg [ZW-1:0] z, z1, z2;
              reg [2*BN-1:0] b;
              wire [2*SHARES-1:0] q_new, q_old;
              wire [2*SHARES-1:0] qs_new, qs_old;
              wire [2*SHARES-1:0] q1_new, q1_old, q2_new, q2_old;
              integer cycle;

              real_dom_shared_mul_gf2 #(.PIPELINED(1), .FIRST_ORDER_OPTIMIZATION(1), .SHARES(SHARES)) dut_mul_new(
                  .ClkxCI(clk), ._XxDI(x), ._YxDI(y), ._ZxDI(z), ._BxDI(b), ._QxDO(q_new));
              real_dom_shared_mul_gf2_old #(.PIPELINED(1), .FIRST_ORDER_OPTIMIZATION(1), .SHARES(SHARES)) dut_mul_old(
                  .ClkxCI(clk), ._XxDI(x), ._YxDI(y), ._ZxDI(z), ._BxDI(b), ._QxDO(q_old));

              real_dom_shared_sqscmul_gf2 #(.PIPELINED(1), .FIRST_ORDER_OPTIMIZATION(1), .SHARES(SHARES)) dut_sq_new(
                  .ClkxCI(clk), ._XxDI(x), ._YxDI(y), ._ZxDI(z), ._BxDI(b), ._QxDO(qs_new));
              real_dom_shared_sqscmul_gf2_old #(.PIPELINED(1), .FIRST_ORDER_OPTIMIZATION(1), .SHARES(SHARES)) dut_sq_old(
                  .ClkxCI(clk), ._XxDI(x), ._YxDI(y), ._ZxDI(z), ._BxDI(b), ._QxDO(qs_old));

              real_dom_shared_mul_gf2_paired #(.PIPELINED(1), .FIRST_ORDER_OPTIMIZATION(1), .SHARES(SHARES)) dut_pair_new(
                  .ClkxCI(clk), ._X1xDI(x1), ._X2xDI(x2), ._YxDI(y), ._Z1xDI(z1), ._Z2xDI(z2), ._BxDI(b),
                  ._Q1xDO(q1_new), ._Q2xDO(q2_new));
              real_dom_shared_mul_gf2_paired_old #(.PIPELINED(1), .FIRST_ORDER_OPTIMIZATION(1), .SHARES(SHARES)) dut_pair_old(
                  .ClkxCI(clk), ._X1xDI(x1), ._X2xDI(x2), ._YxDI(y), ._Z1xDI(z1), ._Z2xDI(z2), ._BxDI(b),
                  ._Q1xDO(q1_old), ._Q2xDO(q2_old));

              always #5 clk = ~clk;

              initial begin
                  clk = 0;
                  x = 0; x1 = 0; x2 = 0; y = 0;
                  z = 0; z1 = 0; z2 = 0; b = 0;
                  repeat (2) @(negedge clk);
                  for (cycle = 0; cycle < 500; cycle = cycle + 1) begin
                      x  = $urandom;
                      x1 = $urandom;
                      x2 = $urandom;
                      y  = $urandom;
                      z  = $urandom;
                      z1 = $urandom;
                      z2 = $urandom;
                      b  = $urandom;
                      @(posedge clk); #1;
                      if (q_new !== q_old) begin
                          $display("plain mismatch shares=%0d cycle=%0d new=%h old=%h", SHARES, cycle, q_new, q_old);
                          $fatal(1);
                      end
                      if (qs_new !== qs_old) begin
                          $display("sqsc mismatch shares=%0d cycle=%0d new=%h old=%h", SHARES, cycle, qs_new, qs_old);
                          $fatal(1);
                      end
                      if ((q1_new !== q1_old) || (q2_new !== q2_old)) begin
                          $display("paired mismatch shares=%0d cycle=%0d q1=%h/%h q2=%h/%h", SHARES, cycle, q1_new, q1_old, q2_new, q2_old);
                          $fatal(1);
                      end
                      @(negedge clk);
                  end
                  $display("PASS shares=%0d", SHARES);
                  $finish;
              end
          endmodule
          EOF
      - name: Elaborate and compare shares 2-4
        run: |
          set -eux
          SOURCES="/tmp/tb_equiv.v /tmp/old_mul.v /tmp/old_sqsc.v /tmp/old_paired.v real_dom_shared_mul_gf2.v real_dom_shared_sqscmul_gf2.v real_dom_shared_mul_gf2_paired.v gf2_mul.v scale.v shared_mul_gf2.v shared_XmulBxorsqsc_gf2.v"
          for s in 2 3 4; do
            iverilog -g2012 -I. -s tb -P tb.SHARES=$s -o /tmp/sim_$s $SOURCES
            vvp /tmp/sim_$s
          done
